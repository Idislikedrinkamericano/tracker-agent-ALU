# tracker-agent config
gmail:
  # Gmail search query for recruiting emails. Tune to taste.
  query: >-
    (subject:application OR subject:applying OR subject:interview
     OR subject:assessment OR subject:"thank you"
     OR from:greenhouse.io OR from:greenhouse-mail.io OR from:lever.co
     OR from:ashbyhq.com OR from:myworkday.com OR from:myworkdayjobs.com
     OR from:workday.com OR from:smartrecruiters.com OR from:icims.com
     OR from:jobvite.com OR from:taleo.net OR from:coderbyte.com
     OR from:hackerrank.com OR from:codesignal.com)
    -from:chase.com -from:capitalone.com -from:linkedin.com
    -subject:"credit card"

  days_back: 30

