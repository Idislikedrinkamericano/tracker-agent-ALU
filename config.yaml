# tracker-agent config
gmail:
  # Gmail search query for recruiting emails. Tune to taste.
  query: >-
    (from:greenhouse.io OR from:lever.co OR from:ashbyhq.com
     OR from:myworkdayjobs.com OR from:workday.com
     OR from:smartrecruiters.com OR from:icims.com
     OR from:jobvite.com OR subject:interview OR subject:"online assessment")
  days_back: 30

# Known companies: used to match emails to a company name.
# Add yours as you apply. Matching is case-insensitive substring on
# the From header and subject.
companies:
  - Stripe
  - Figma
  - Deepgram
  - Cadence
  - Skydio
  - Serval
  - Clay
  - Rippling
  - Palantir
  - T-Mobile
  - Viam
  - Circleback
  - Netic
  - Affirm
  - Coinbase
  - Amazon
  - Cloudflare
  - xAI

# Sender domains that are pure ATS plumbing (never a company name).
ats_domains:
  - greenhouse.io
  - lever.co
  - ashbyhq.com
  - myworkdayjobs.com
  - workday.com
  - smartrecruiters.com
  - icims.com
  - jobvite.com
  - taleo.net
  - brightspringhealth.com
